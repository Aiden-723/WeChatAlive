name: Windows smoke test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and import
        shell: pwsh
        run: |
          python -m compileall -q wechat_ai_bot.py bot_dashboard.py wechatauto
          python -c "import wechat_ai_bot, bot_dashboard, wechatauto"
      - name: Validate public template
        shell: pwsh
        run: |
          python -c "import json; c=json.load(open('bot_config.example.json',encoding='utf-8')); assert c['model']=='' and c['base_url']==''"
          if (Test-Path '填写API密钥.txt') { throw 'Secret file must not be committed' }
          if (Test-Path 'bot_config.json') { throw 'Personal config must not be committed' }

